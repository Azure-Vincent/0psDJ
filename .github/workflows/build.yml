name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create this release (e.g. v1.2.0) from the selected branch; empty = build only'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # On a version tag (v1.2.3), or a manual run with a release tag, build with that
      # version so file names match the release.
      - if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
      # Unsigned builds: no code-signing certificates are configured.
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: InfrastructureLab-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.exe
            release/*.zip
            release/*.dmg
          if-no-files-found: error

  # A pushed version tag (or a release published on GitHub, which creates the tag)
  # gets the executables attached as release assets. A manual run with a
  # release tag creates the tag on the built commit and the release.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
